name: Collect (daily)

# Runs `researcher collect` unattended each day and persists the SQLite state to
# a dedicated `state` branch (regular commits, no force-push) so main stays clean.
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:

# Run in production logging mode so source names / URLs are redacted in the
# (public) Actions log.
env:
  RESEARCHER_LOG_MODE: production

# Never let two runs race the `state` branch; queue rather than cancel so an
# in-flight collection finishes and commits before the next starts. Shared with
# the weekly synthesize workflow so collect and synthesize also serialize.
concurrency:
  group: state-branch
  cancel-in-progress: false

permissions:
  contents: write # to push the state branch

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4

      - name: Restore prior state.db from the `state` branch (if it exists)
        # Manual shallow fetch rather than actions/checkout@v4 with `ref: state`:
        # on a cold start (no `state` branch yet) checkout exits non-zero and the
        # step shows red even with continue-on-error, which is confusing. The
        # `if` here swallows the cold-start fetch failure so this step stays
        # GREEN, and we only need the single latest state.db blob, not history.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: bearer ${GH_TOKEN}"
          REMOTE="https://github.com/${{ github.repository }}.git"
          rm -rf _state && mkdir _state && cd _state
          git init -q
          git remote add origin "$REMOTE"
          if git -c http.extraheader="$AUTH" fetch -q --depth 1 origin state; then
            git checkout -q FETCH_HEAD
            echo "fetched prior state from the state branch"
          else
            echo "no state branch yet — cold start"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Seed state.db from prior run (if any)
        # Validate the restored DB. If the committed copy is somehow corrupt,
        # cold-start instead of restoring it every run forever — otherwise the
        # cron wedges red with no self-recovery. The corrupt blob stays in the
        # `state` branch's git history for forensics (commits are never rewritten).
        run: |
          mkdir -p .researcher
          if [ -f _state/state.db ]; then
            cp _state/state.db .researcher/state.db
            if uv run python -c "import sys; from researcher_agent.state import Database; \
              d = Database('.researcher/state.db'); ok = d.integrity_check(); d.close(); \
              sys.exit(0 if ok else 1)"; then
              echo "restored prior state.db (integrity ok)"
            else
              echo "::error::restored state.db failed integrity check — cold-starting"
              rm -f .researcher/state.db
            fi
          else
            echo "no prior state — cold start"
          fi

      - name: Collect
        # No --fail-on-error: a flaky feed must not block persisting the day's
        # good items. collect exits 0 on partial source failures and checkpoints
        # the WAL into state.db before exiting. Classification runs only if
        # GEMINI_API_KEY is set (else it's skipped cleanly); the rendered reports
        # go to an ephemeral dir (publishing to the inbox repo is a separate flow).
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This is a PUBLIC repo, so the committed example list IS the production
          # source list for this cron (the real personal sources.yaml stays local).
          cp config/sources.example.yaml config/sources.yaml
          cp config/agent.example.yaml config/agent.yaml
          uv run researcher collect --db .researcher/state.db --vault _vault
          uv run researcher status --db .researcher/state.db --sources config/sources.yaml

      - name: Checkpoint WAL then verify the file we will commit
        # Checkpoint FIRST (fold the -wal sidecar into the main file), THEN run
        # integrity_check on the exact bytes that will be committed. A corrupt
        # post-checkpoint DB fails the job here so the bad file is never pushed.
        run: |
          uv run python -c "import sys; from researcher_agent.state import Database; \
            db = Database('.researcher/state.db'); db.checkpoint(); \
            ok = db.integrity_check(); db.close(); sys.exit(0 if ok else 1)"

      - name: Commit state.db to the `state` branch
        env:
          # Keep the token out of the on-disk remote URL / any echoed git output;
          # pass it as a per-invocation auth header instead (and it's masked anyway).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: bearer ${GH_TOKEN}"
          REMOTE="https://github.com/${{ github.repository }}.git"
          # Retry the fetch->commit->push cycle: if another writer (e.g. a manual
          # dispatch) advanced `state` between our fetch and push, the non-force
          # push is rejected — re-fetch and re-apply our state.db rather than
          # failing the day. state.db is a single blob that fully replaces the
          # prior, so latest-writer-wins is correct and anything the other run
          # had is re-collected idempotently next run.
          pushed=0
          for attempt in 1 2 3; do
            # Work in a fresh clean clone so only state.db can ever be committed
            # (no git add -A) and each attempt re-fetches the latest tip.
            rm -rf _publish && mkdir _publish && cd _publish
            git init -q
            # Identity MUST be set on THIS repo (the one the commit runs in), not
            # the outer main checkout — otherwise `git commit` fails with
            # "Author identity unknown / Please tell me who you are".
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git remote add origin "$REMOTE"
            if git -c http.extraheader="$AUTH" fetch -q origin state; then
              git checkout -q -b state FETCH_HEAD
            else
              git checkout -q --orphan state
            fi
            cp ../.researcher/state.db state.db
            # Ignore the SQLite WAL sidecars (not state.db itself!). We only ever
            # `git add state.db .gitignore` by explicit path — never `git add -A`
            # — so nothing else can sneak in either.
            printf 'state.db-wal\nstate.db-shm\nstate.db-journal\n' > .gitignore
            git add state.db .gitignore
            if git diff --cached --quiet; then
              echo "no state change to commit"
              pushed=1; cd ..; break
            fi
            git commit -q -m "state: collect $(date -u +%Y-%m-%dT%H:%MZ)"
            if git -c http.extraheader="$AUTH" push -q origin state; then
              echo "pushed state (attempt $attempt)"
              pushed=1; cd ..; break
            fi
            echo "::warning::state push rejected (attempt $attempt) — re-fetching and retrying"
            cd ..
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::failed to push state.db after retries"
            exit 1
          fi

      - name: Surface chronically failing sources
        # Runs AFTER the state commit so a dead feed makes the run red for
        # visibility without ever costing the day's persisted progress.
        run: uv run researcher status --db .researcher/state.db --max-consecutive-errors 7
